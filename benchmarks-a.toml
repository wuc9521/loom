delis = "delis"
results_dir = "bench-results"
solve_timeout_secs = 600
# Default mode is `native`, which benchmarks Delis itself.
# Set `mode = "external_sygus"` and configure `sygus_solver` only for
# explicit dump-and-solver experiments.

[[folders]]
name = "reg-deepregex"
path = "benchmark/Reg/deepregex"
recursive = false

[[folders]]
name = "reg-alpharegex"
path = "benchmark/Reg/alpharegex"
recursive = false

[[folders]]
name = "reg-so"
path = "benchmark/Reg/so"
recursive = false

[[folders]]
name = "ctl-learnctl-generated"
path = "benchmark/CTL/learnctl/generated"
recursive = false

[[folders]]
name = "string-duet"
path = "benchmark/String/duet"
recursive = false

[[folders]]
name = "facet-cfg"
path = "benchmark/facet-oopsla23/cfg"
recursive = false

[[folders]]
name = "facet-kml"
path = "benchmark/facet-oopsla23/kml"
recursive = false
