delis = "delis"
results_dir = "bench-results"
solve_timeout_secs = 600
jobs = 0

# External-comparison manifest. These suites benchmark non-Delis tools or
# Delis-generated SyGuS problems with an external solver.

[[suites]]
name = "reg-alpharegex-cvc5"
path = "benchmark/Reg/alpharegex"
recursive = false
mode = "external_sygus"
sygus_solver = "cvc5"
persistent_sygus_dir = "benchmark/Reg/alpharegex/sygus"

[[suites]]
name = "reg-deepregex-cvc5"
path = "benchmark/Reg/deepregex"
recursive = false
mode = "external_sygus"
sygus_solver = "cvc5"
persistent_sygus_dir = "benchmark/Reg/deepregex/sygus"

[[suites]]
name = "reg-so-cvc5"
path = "benchmark/Reg/so"
recursive = false
mode = "external_sygus"
sygus_solver = "cvc5"
persistent_sygus_dir = "benchmark/Reg/so/sygus"

[[suites]]
name = "fo-folseparators-artifact"
path = "benchmark-upstream/FO/folseparators/conjectures/extracted"
recursive = false
mode = "external_command"
file_extensions = ["fol"]
external_command = "scripts/external/folseparators-artifact.sh"
solve_timeout_secs = 600
