[package]
edition = "2021"
name = "delis"
version = "0.1.0"

[profile.release]
incremental = true
# Keep line tables in release so samply / perf can resolve function names.
# Line-tables-only adds minimal size and no runtime overhead. Remove if
# binary size becomes an issue.
debug = "line-tables-only"

[dependencies]
clap = {version = "4.4", features = ["derive"]}# command line argument parser       
ctrlc = "3.4"
derive_more = {version = "2.1.1", features = ["display"]}
dryadsynth-bv = {path = "../dryadsynth-bv"}
env_logger = "0.11.5"
itertools = "0.15.0"
libc = "0.2"
mimalloc = {version = "0.1", default-features = false}
log = "0.4.22"
pest = "2.8.1"
pest_derive = "2.8.1"
regex = "1.12.2"
rustc-hash = "2.1.3"
serde = {version = "1", features = ["derive"]}
sygus-parser = "0.1.5"
