[package]
edition = "2021"
name = "ls-parser"
version = "0.1.0"

[dependencies]
clap = {version = "4.4", features = ["derive"]}# command line argument parser  
derive_more = "0.99.17" 
itertools = "0.14.0" 
pest = "2.7.3" 
pest_derive = "2.7.3" 
