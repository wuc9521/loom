[package]
edition = "2021"
name = "delis"
version = "0.1.0"

[dependencies]
chrono = "0.4" 
clap = {version = "4.4", features = ["derive"]}# command line argument parser       
derive_more = { version = "2.1.1", features = ["display"] }
env_logger = "0.11.5"
ctrlc = "3.4"
itertools = "0.14.0" 
lexpr = "0.2.7" 
log = "0.4.22"
libc = "0.2"
pest = "2.8.1"
pest_derive = "2.8.1"
serde = { version = "1", features = ["derive"] }
sygus-parser = {path = "../sygus-parser-rs"} 
toml = "1.1.2"
walkdir = "2"
cvc5 = { version = "0.4", features = ["static"] }
