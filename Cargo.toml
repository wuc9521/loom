[package]
edition = "2021"
name = "delis"
version = "0.1.0"

[profile.release]
incremental = true

[dependencies]
clap = {version = "4.4", features = ["derive"]}# command line argument parser       
ctrlc = "3.4"
derive_more = {version = "2.1.1", features = ["display"]}
dryadsynth-bv = {path = "../dryadsynth-bv"}
env_logger = "0.11.5"
itertools = "0.14.0"
lexpr = "0.2.7"
libc = "0.2"
log = "0.4.22"
pest = "2.8.1"
pest_derive = "2.8.1"
regex = "1.12.2"
rustc-hash = "1.1.0"
serde = {version = "1", features = ["derive"]}
sygus-parser = {path = "../sygus-parser-rs"}
toml = "1.1.2"
